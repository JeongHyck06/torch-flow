# TorchFlow CI. 세 가지를 본다: 테스트, torch 안정판 두 개와의 호환, 생성 코드의 도구 무의존.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 기획서 13.1 M1: 안정판 두 개를 계속 확인한다.
        torch: ["2.7.1", "2.8.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" pillow numpy
      - name: pytest
        run: pytest -q

  generated-code-runs-without-torchflow:
    # 기획서 13.1 M6 게이트: 템플릿을 package로 뽑아 torchflow 없는 환경에서 돌린다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: generate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          for graph in examples/*.tfg.json; do
            name=$(basename "$graph" .tfg.json)
            torchflow codegen "$graph" --unit package --target "dist/$name"
            torchflow check "dist/$name"
          done
      - name: run each template in a clean environment
        run: |
          pip uninstall -y torchflow
          for project in dist/*; do
            module=$(ls "$project/src")
            (cd "$project" && PYTHONPATH=src python -m "$module.train" \
               --steps 4 --batch 2 --device cpu --dataset teacher --run_dir runs/ci)
          done
